name: arpitvarta
description: ArpitVarta - Consult verified professionals
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # HTTP & API
  http: ^1.1.2

  # Real-time
  socket_io_client: ^3.1.4

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # Navigation
  go_router: ^17.0.0

  # UI Components
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.2
  fl_chart: ^1.1.0

  # Audio / Video
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  agora_rtc_engine: ^6.3.0

  # Payment
  razorpay_flutter: ^1.4.0

  # Firebase (notifications)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1

  # Image
  image_picker: ^1.0.7

  # Utils
  intl: ^0.20.0
  url_launcher: ^6.2.3
  permission_handler: ^12.0.1
  timeago: ^3.6.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  pull_to_refresh: ^2.0.0

  cupertino_icons: ^1.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

