workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Debug project structure
        script: |
          pwd
          ls
          find . -name Podfile

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Set iOS deployment target to 15
        script: |
          sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/g" ./ios/Podfile
          cat ./ios/Podfile

      - name: Clean pods
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - your@email.com