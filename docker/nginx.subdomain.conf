# ── ArpitVarta — arpitvarta.grahvarta.com ─────────────────────────────────
# Appended to GrahVarta's nginx.conf on the shared VPS. Upstreams are resolved
# at request time through Docker DNS (variables + resolver), so if the
# ArpitVarta stack is down GrahVarta's nginx still starts and reloads.

server {
    listen 80;
    listen [::]:80;
    server_name arpitvarta.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arpitvarta.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/arpitvarta.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arpitvarta.grahvarta.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $av_backend      http://av-backend:3000;
    set $av_web          http://av-web:80;
    set $av_professional http://av-professional:80;
    set $av_admin        http://av-admin:80;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Socket.io (chat, billing ticks, call signalling)
    location /socket.io/ {
        proxy_pass         $av_backend;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API + uploaded files (served by Express)
    location ^~ /api/     { proxy_pass $av_backend; proxy_read_timeout 60s; }
    location ^~ /uploads/ { proxy_pass $av_backend; expires 7d; }
    location = /health    { proxy_pass $av_backend; }

    location ^~ /admin               { proxy_pass $av_admin; }
    location ^~ /professional-portal { proxy_pass $av_professional; }
    location /                       { proxy_pass $av_web; }
}
