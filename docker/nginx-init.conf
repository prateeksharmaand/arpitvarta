# Minimal HTTP-only config used during first-time SSL bootstrap.
# Replaced by nginx.conf after certificates are issued.
server {
    listen 80;
    listen [::]:80;
    server_name arpitvarta.com www.arpitvarta.com api.arpitvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "ArpitVarta — deploying...";
        add_header Content-Type text/plain;
    }
}
